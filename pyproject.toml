[project]
name = "electrodynamics-simulations"
version = "0.1.0"
description = "Numerical solutions of the classical electrodynamics equations."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jax-dataclasses>=1.6.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "rich>=13.0.0",
    "scipy>=1.17.1",
    "typer>=0.26.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[project.optional-dependencies]
cpu = ["jax>=0.10.2"]
rocm = ["jax[rocm7-local]>=0.10.2"]
cu130 = ["jax[cuda13]>=0.10.2"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "rocm" }, { extra = "cu130" }]]

[tool.uv.build-backend]
module-name = "electrodynamics"
